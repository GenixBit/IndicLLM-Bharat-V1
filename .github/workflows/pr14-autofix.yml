name: PR 14 targeted autofix

on:
  push:
    branches:
      - feat/milestone-4-local-model-inference-adapter

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/milestone-4-local-model-inference-adapter
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.5.0"
          args: >-
            format
            bharat/eval/__init__.py
            bharat/eval/local_inference.py
            scripts/generate_bharatbench_local_predictions.py
            tests/eval/test_local_inference.py
            tests/scripts/test_generate_bharatbench_local_predictions.py
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.5.0"
          args: >-
            check --fix
            bharat/eval/__init__.py
            bharat/eval/local_inference.py
            scripts/generate_bharatbench_local_predictions.py
            tests/eval/test_local_inference.py
            tests/scripts/test_generate_bharatbench_local_predictions.py
      - name: Commit targeted Ruff fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            bharat/eval/__init__.py \
            bharat/eval/local_inference.py \
            scripts/generate_bharatbench_local_predictions.py \
            tests/eval/test_local_inference.py \
            tests/scripts/test_generate_bharatbench_local_predictions.py
          git commit -m "fix(ci): apply targeted Ruff formatting"
          git push origin HEAD:feat/milestone-4-local-model-inference-adapter
