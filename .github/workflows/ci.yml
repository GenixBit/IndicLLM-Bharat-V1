name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  WANDB_MODE: "disabled"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/ruff-action@v1
        with:
          version: "0.5.0"
          args: "format --check ."
      - uses: astral-sh/ruff-action@v1
        with:
          version: "0.5.0"
          args: "check ."

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/ruff-action@v1
        with:
          version: "0.5.0"
          args: "check ."

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy torch transformers datasets numpy pyyaml tokenizers sentencepiece
      - name: Run mypy
        run: mypy bharat/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          pytest --cov=bharat --cov=train --cov=eval --cov=inference --cov=scripts \
                 --cov-report=term-missing --cov-report=xml \
                 -m "not slow and not gpu and not integration"
      - uses: codecov/codecov-action@v4
        if: ${{ matrix.python-version == '3.11' && !cancelled() && !failure() }}
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  diff-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check for trailing whitespace and conflict markers
        run: git diff --check
