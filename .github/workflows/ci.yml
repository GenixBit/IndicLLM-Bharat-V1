name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  WANDB_MODE: "disabled"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      python: ${{ steps.scope.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Detect Python-impacting changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # checkout fetch-depth: 0 contains the PR merge commit and its base.
          # Comparing trees directly avoids fragile three-dot merge-base lookup.
          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)"
          python_changes="$(printf '%s\n' "$changed_files" | grep -Ev '^(docs/|README\.md$)' || true)"
          if [[ -n "$python_changes" ]]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

  docs-check:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate documentation-only change
        run: |
          git diff --check "${{ github.event.pull_request.base.sha }}" HEAD

  format:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.5.0"
          args: "format --check ."
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.5.0"
          args: "check ."

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.5.0"
          args: "check ."

  typecheck:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy torch transformers datasets numpy pyyaml tokenizers sentencepiece
      - name: Run mypy
        run: mypy --explicit-package-bases bharat/ scripts/ inference/

  test:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e ".[dev]"
      - name: Run tests
        env:
          # Explicit synthetic fixture for offline integration tests only; not a production tokenizer.
          BHARAT_OFFLINE_TEST_MODE: "1"
          BHARAT_OFFLINE_TEST_TOKENIZER_PATH: "tests/fixtures/tiny_bpe_tokenizer.json"
        run: |
          pytest --cov=bharat --cov=train --cov=eval --cov=inference --cov=scripts \
                 --cov-report=term-missing --cov-report=xml \
                 -m "not slow and not gpu and not integration"
      - uses: codecov/codecov-action@v4
        if: ${{ matrix.python-version == '3.11' && !cancelled() && !failure() }}
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  diff-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for trailing whitespace and conflict markers
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          else
            git show --check --oneline --decorate HEAD
          fi

  required:
    name: required-checks
    if: always()
    needs: [changes, diff-check, docs-check, format, lint, typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce complete CI outcome
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["JOB_RESULTS"])
          errors = []
          for name in ("changes", "diff-check"):
              if jobs[name]["result"] != "success":
                  errors.append(f"{name}={jobs[name]['result']}")

          scope = jobs["changes"]["outputs"].get("python")
          if scope == "true":
              required = ("format", "lint", "typecheck", "test")
              skipped = ("docs-check",)
          elif scope == "false":
              required = ("docs-check",)
              skipped = ("format", "lint", "typecheck", "test")
          else:
              errors.append(f"unrecognized python-impacting scope: {scope!r}")
              required, skipped = (), ()

          for name in required:
              if jobs[name]["result"] != "success":
                  errors.append(f"{name}={jobs[name]['result']}")
          for name in skipped:
              if jobs[name]["result"] != "skipped":
                  errors.append(f"{name} should be skipped, got {jobs[name]['result']}")

          if errors:
              print("CI gate failed: " + "; ".join(errors), file=sys.stderr)
              sys.exit(1)
          print("All applicable required CI jobs passed.")
          PY
