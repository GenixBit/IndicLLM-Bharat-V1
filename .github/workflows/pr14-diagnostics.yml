name: PR 14 diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WANDB_MODE: disabled
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Capture formatter output
        shell: bash
        run: |
          set +e
          ruff format --diff . > ruff-format.diff 2>&1
          echo $? > ruff-format.exit
          exit 0
      - name: Capture lint output
        shell: bash
        run: |
          set +e
          ruff check . > ruff-check.txt 2>&1
          echo $? > ruff-check.exit
          exit 0
      - name: Capture focused test output
        shell: bash
        run: |
          set +e
          pytest tests/eval/test_local_inference.py tests/scripts/test_generate_bharatbench_local_predictions.py -vv > pytest-focused.txt 2>&1
          echo $? > pytest-focused.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr14-diagnostics
          path: |
            ruff-format.diff
            ruff-format.exit
            ruff-check.txt
            ruff-check.exit
            pytest-focused.txt
            pytest-focused.exit
