name: PR14 scoped autofix

on:
  push:
    branches:
      - feat/milestone-4-local-model-inference-adapter

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WANDB_MODE: disabled
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/milestone-4-local-model-inference-adapter
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scoped tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.5.0 pytest
          python -m pip install -e ".[dev]"
      - name: Apply scoped Ruff fixes
        run: |
          ruff format \
            bharat/eval/__init__.py \
            bharat/eval/local_inference.py \
            scripts/generate_bharatbench_local_predictions.py \
            tests/eval/test_local_inference.py \
            tests/scripts/test_generate_bharatbench_local_predictions.py
          ruff check --fix \
            bharat/eval/__init__.py \
            bharat/eval/local_inference.py \
            scripts/generate_bharatbench_local_predictions.py \
            tests/eval/test_local_inference.py \
            tests/scripts/test_generate_bharatbench_local_predictions.py
      - name: Run focused offline tests
        run: |
          pytest tests/eval/test_local_inference.py tests/scripts/test_generate_bharatbench_local_predictions.py -q
      - name: Commit scoped fixes
        run: |
          if git diff --quiet; then
            echo "No scoped changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            bharat/eval/__init__.py \
            bharat/eval/local_inference.py \
            scripts/generate_bharatbench_local_predictions.py \
            tests/eval/test_local_inference.py \
            tests/scripts/test_generate_bharatbench_local_predictions.py
          git commit -m "fix: apply scoped Ruff fixes for milestone 4.3"
          git push
