name: PR 14 scoped auto-fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install ruff==0.5.0
      - name: Apply scoped Ruff fixes
        run: |
          files=(
            bharat/eval/__init__.py
            bharat/eval/local_inference.py
            scripts/generate_bharatbench_local_predictions.py
            tests/eval/test_local_inference.py
            tests/scripts/test_generate_bharatbench_local_predictions.py
          )
          ruff format "${files[@]}"
          ruff check "${files[@]}" --fix || true
          ruff format "${files[@]}"
      - name: Commit scoped fixes
        run: |
          files=(
            bharat/eval/__init__.py
            bharat/eval/local_inference.py
            scripts/generate_bharatbench_local_predictions.py
            tests/eval/test_local_inference.py
            tests/scripts/test_generate_bharatbench_local_predictions.py
          )
          if git diff --quiet -- "${files[@]}"; then
            echo "No scoped Ruff changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "style: apply scoped Ruff fixes"
          git push origin "HEAD:${{ github.head_ref }}"
