# IndicLLM-Bharat-V1 — Pretraining Data Mixture Recipe (1B Tokens Target)
#
# Language and domain weights must each sum to exactly 1.0.

recipe_name: "indic_pretrain_1b"
description: "High-quality multilingual Indic-first pretraining mixture across 13 scheduled languages + English anchor"

language_weights:
  hi: 0.30  # Hindi
  bn: 0.12  # Bengali
  ta: 0.10  # Tamil
  te: 0.10  # Telugu
  mr: 0.08  # Marathi
  gu: 0.05  # Gujarati
  kn: 0.05  # Kannada
  ml: 0.05  # Malayalam
  pa: 0.03  # Punjabi
  or: 0.02  # Odia
  ur: 0.03  # Urdu
  as: 0.02  # Assamese
  sa: 0.01  # Sanskrit
  en: 0.04  # English alignment anchor

domain_weights:
  general: 0.60
  code: 0.15
  mathematics: 0.10
  science: 0.10
  legal: 0.05

max_pct_per_source: 0.40
min_record_threshold: 100
