# GPT-2 1B — serious v1
# 24 layers, 2048 dim, 16 heads

name: gpt2-1b
model:
  n_layer: 24
  n_head: 16
  n_embd: 2048
  block_size: 2048
  vocab_size: 32000
  bias: false

training:
  batch_size: 4
  gradient_accumulation_steps: 128
  max_iters: 400000
  eval_interval: 2000
  eval_iters: 200
  log_interval: 10
  learning_rate: 2.0e-4
  min_lr: 2.0e-5
  warmup_iters: 8000
  lr_decay_iters: 400000
  weight_decay: 0.1
  grad_clip: 1.0
  dtype: bfloat16
  compile: true
  gradient_checkpointing: true

data:
  train_bin: data/shards/train.bin
  val_bin: data/shards/val.bin
  meta_pkl: data/shards/meta.pkl
  tokenizer_dir: data/tokenizer

checkpoint:
  out_dir: checkpoints/gpt2-1b
  eval_only: false
  init_from: scratch

wandb:
  enabled: true
  project: llm-lab
  run_name: gpt2-1b-pretrain

cloud:
  gpu: A100-80GB
  num_gpus: 8
  estimated_hours: 400
  estimated_cost_usd: 20000
