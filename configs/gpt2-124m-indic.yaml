# GPT-2 124M — IndicLLM-Bharat configuration
# Trained on Indic language data (Wikipedia + Sangraha)
#
# Current tokenizer: GPT-2 BPE (vocab 50257)
# Switch to SentencePiece after collecting >1B tokens with prepare_indic.py
# Requires: data/indic/train.bin  (run data/download_indic.py first)

name: gpt2-124m-indic
model:
  n_layer: 12
  n_head: 12
  n_embd: 768
  block_size: 1024        # 1024 for initial run; bump to 2048 once >1B tokens
  vocab_size: 50257       # GPT-2 BPE — overridden from meta.pkl at runtime
  bias: false

training:
  batch_size: 12
  gradient_accumulation_steps: 40
  max_iters: 100000
  eval_interval: 500
  eval_iters: 200
  log_interval: 10
  learning_rate: 6.0e-4
  min_lr: 6.0e-5
  warmup_iters: 2000
  lr_decay_iters: 100000
  weight_decay: 0.1
  grad_clip: 1.0
  dtype: bfloat16
  compile: true

data:
  train_bin: data/indic/train.bin
  val_bin:   data/indic/val.bin
  meta_pkl:  data/indic/meta.pkl

checkpoint:
  out_dir: checkpoints/gpt2-124m-indic
  eval_only: false
  init_from: scratch

wandb:
  enabled: true
  project: indicllm-bharat
  run_name: gpt2-124m-indic-pretrain

cloud:
  gpu: A10G-24GB
  estimated_hours: 12
  estimated_cost_usd: 12
  note: |
    Run after collecting >500M tokens with download_indic.py.
    Current shards (226K tokens) are too small for full training.
    Quick smoke test: reduce max_iters=100, batch_size=4, block_size=512
