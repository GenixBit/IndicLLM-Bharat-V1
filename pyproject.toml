[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bharat-ai"
version = "0.1.0"
description = "Bharat AI — Large Language Model for Indian languages"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.19.0",
    "tokenizers>=0.19.0",
    "accelerate>=0.30.0",
    "peft>=0.11.0",
    "trl>=0.9.0",
    "wandb>=0.17.0",
    "lm-eval>=0.4.4",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "huggingface-hub>=0.23.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.0",
]

[project.scripts]
validate-data-manifest = "scripts.validate_data_manifest:main"
validate-dataset-approval = "scripts.validate_dataset_approval:main"
plan-data-shards = "scripts.plan_data_shards:main"
compute-data-stats = "scripts.compute_data_stats:main"
prepare-local-data = "scripts.prepare_local_data:main"
build-dataset-release = "scripts.build_dataset_release:main"
run-bharatbench = "scripts.run_bharatbench:main"
generate-bharatbench-local-predictions = "scripts.generate_bharatbench_local_predictions:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.setuptools.packages.find]
include = ["bharat*", "train*", "eval*", "inference*", "scripts*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
    "integration: marks integration tests",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
allow_redefinition = true

[[tool.mypy.overrides]]
module = ["train.*", "eval.*", "inference.*", "scripts.*", "data.*"]
ignore_errors = true

[tool.coverage.run]
source = ["bharat", "train", "eval", "inference", "scripts"]
branch = true