[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bharat-ai"
version = "0.1.0"
description = "Bharat AI — Large Language Model for Indian languages"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.19.0",
    "tokenizers>=0.19.0",
    "accelerate>=0.30.0",
    "peft>=0.11.0",
    "trl>=0.9.0",
    "wandb>=0.17.0",
    "lm-eval>=0.4.4",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "huggingface-hub>=0.23.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.0",
]

[project.scripts]
validate-data-manifest = "scripts.validate_data_manifest:main"
validate-dataset-approval = "scripts.validate_dataset_approval:main"
plan-data-shards = "scripts.plan_data_shards:main"
compute-data-stats = "scripts.compute_data_stats:main"
prepare-local-data = "scripts.prepare_local_data:main"
build-dataset-release = "scripts.build_dataset_release:main"
run-bharatbench = "scripts.run_bharatbench:main"
generate-bharatbench-local-predictions = "scripts.generate_bharatbench_local_predictions:main"
build-leaderboard = "scripts.build_leaderboard:main"
stream-local = "scripts.stream_local:main"
run-serving-control-smoke = "scripts.run_serving_control_smoke:main"
run-export-plan = "scripts.run_export_plan:main"
check-tokenizer-acceptance = "scripts.check_tokenizer_acceptance:main"
evaluate-tokenizer = "scripts.evaluate_tokenizer:main"
validate-tokenizer-evidence = "scripts.validate_tokenizer_evidence:main"
validate-production-tokenizer-evidence = "scripts.validate_production_tokenizer_evidence:main"
pretrain-bharat = "scripts.pretrain_bharat:main"
prepare-indic-data = "scripts.prepare_indic_data:main"
plan-data-mixture = "scripts.plan_data_mixture:main"
run-pipeline = "scripts.run_pipeline:main"
validate-data-registry = "scripts.validate_data_registry:main"
calculate-params = "scripts.calculate_params:main"
sample-tokenizer-corpus = "scripts.sample_tokenizer_corpus:main"
train-tokenizer = "scripts.train_tokenizer:main"
generate-tokenizer-evidence = "scripts.generate_tokenizer_evidence:main"
build-release-bundle = "scripts.build_release_bundle:main"
sanity-check = "scripts.sanity_check:main"
push-to-hub = "scripts.push_to_hub:main"
bharat-generate = "inference.generate:main"
bharat-api = "inference.api:main"
export-ollama = "inference.export_ollama:main"
bharat-monitor = "scripts.monitor:main"
validate-q8-0-compatibility = "scripts.validate_q8_0_compatibility:main"
check-production-tokenizer-evidence-readiness = "scripts.check_production_tokenizer_evidence_readiness:main"
build-production-tokenizer-evidence = "scripts.build_production_tokenizer_evidence:main"
generate-bharatbench-predictions = "scripts.generate_bharatbench_predictions:main"
bharat-profile = "scripts.profile_inference:main"
bharat-playground = "inference.playground:main"
bharat-curriculum = "scripts.generate_indic_curriculum:main"
bharat-train-smart = "scripts.train_smart_bharat:main"
bharat-preferences = "scripts.generate_preference_curriculum:main"
bharat-train-dpo = "scripts.train_dpo_bharat:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "gguf>=0.19.0",
]

[tool.setuptools.packages.find]
include = ["bharat*", "train*", "eval*", "inference*", "scripts*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
    "integration: marks integration tests",
    "compatibility: marks external compatibility tests (deselect with '-m \"not compatibility\"')",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
allow_redefinition = true

[[tool.mypy.overrides]]
module = ["train.*", "eval.*", "inference.*", "scripts.*", "data.*"]
ignore_errors = true

[tool.coverage.run]
source = ["bharat", "train", "eval", "inference", "scripts"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["RUF001", "RUF002", "RUF003"]
